<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boardgame</title>
    <link rel="stylesheet" href="board.css">
</head>

<body>

    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>high-score
                        <span id="highscore">00</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>score
                        <span id="score">00</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>
                        <span id="time">timer: 00</span>
                    </h3>
                </div>

            </div>
            <div class="board">

            </div>
        </section>

        <div class="modal">
            <div>
                <h1>start game</h1>
                <button class="btn">
                    let's Go

                </button>
            </div>


        </div>

        <div class="modalreset">
            <div>
                <h1 class="h1"> game restart</h1>
                <button class="btnrestart">
                    Go ahead
                </button>
            </div>


        </div>
    </main>


    <script src="board copy.js"></script>

</body>

</html>
